<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistemas de Cadastro e Correção de Prova - Login / Cadastro</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fonte Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

  <main class="auth-container">
    <form class="auth-card" action="#" method="POST">
      
      <fieldset>
        <legend>FAÇA LOGIN OU CADASTRO PARA TER ACESSO AO SISTEMA DE CORREÇÃO DE PROVAS</legend>
        
        <div class="form-group">
          <label for="idNome">Nome Completo:</label>
          <input type="text" name="nome" id="idNome" placeholder="Digite seu nome completo" required>
        </div>

        <div class="form-group">
          <label for="idEmail">E-mail:</label>
          <input type="email" name="email" id="idEmail" placeholder="seuemail@exemplo.com" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="idCelular">Celular:</label>
            <input type="tel" name="celular" id="idCelular" placeholder="(99) 99999-9999" title="Digite o número de telefone">
          </div>

          <div class="form-group">
            <label for="idNascimento">Nascimento:</label>
            <input type="date" name="nascimento" id="idNascimento">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="idSenha">Senha:</label>
            <input type="password" name="senha" minlength="6" maxlength="10" id="idSenha" placeholder="6 a 10 caracteres" required>
          </div>

          <div class="form-group">
            <label for="idCsenha">Confirmar Senha:</label>
            <input type="password" name="csenha" minlength="6" maxlength="10" id="idCsenha" placeholder="Repita a senha" required>
          </div>
        </div>

        <!-- BOTÕES DE AÇÃO DO FORMULÁRIO -->
        <div class="form-actions">
          <button type="submit" class="btn btn-salvar">Salvar Cadastro</button>
          <button type="reset" class="btn btn-cancelar">Cancelar</button>
        </div>

      </fieldset>

    </form>
  </main>
  <script src="script.js"></script>

</body>
</html>
