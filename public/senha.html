<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Alterar senha | Apta</title><link rel="stylesheet" href="style.css"><style>
body.auth-page{background:#f5f7fb}.auth-card{max-width:440px;width:100%;border-radius:18px}.apta-brand{font-size:28px;font-weight:700;color:#2459d5;margin-bottom:18px}.senha-title{font-size:23px;margin-bottom:8px}.senha-desc{color:#64748b;margin-bottom:24px}.senha-toggle{display:flex;align-items:center;gap:8px;margin:14px 0;color:#475569;font-size:14px}.senha-toggle input{width:auto}.auth-card .btn-salvar{background:#2459d5;width:100%}.auth-links{margin-top:20px}
</style></head><body class="auth-page"><main class="auth-container"><form class="auth-card" id="troca" hidden><div class="apta-brand">apta.</div><h1 class="senha-title">Alterar senha</h1><p class="senha-desc">Proteja sua conta. Após a alteração, entre novamente com a nova senha.</p>
<div class="form-group"><label for="atual">Senha atual</label><input id="atual" name="atual" type="password" autocomplete="current-password" required maxlength="1024"></div>
<div class="form-group"><label for="nova">Nova senha</label><input id="nova" name="nova" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><small>Use pelo menos 8 caracteres.</small></div>
<div class="form-group"><label for="confirmacao">Confirmar nova senha</label><input id="confirmacao" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></div>
<label class="senha-toggle"><input id="mostrar" type="checkbox"> Mostrar senhas</label><div id="mensagem" hidden role="alert"></div><button class="btn btn-salvar" type="submit">Salvar nova senha</button><p class="auth-links"><a id="voltar" href="index.html">Voltar ao painel</a></p></form></main><script src="script.js"></script><script>
const formSenha=document.getElementById('troca'), msg=document.getElementById('mensagem');
exigirPapel('superadmin','professor','aluno').then(eu=>{document.getElementById('voltar').href=PAGINA_INICIAL[eu.role];formSenha.hidden=false;}).catch(()=>{});
document.getElementById('mostrar').addEventListener('change',e=>{formSenha.querySelectorAll('input[autocomplete]').forEach(i=>i.type=e.target.checked?'text':'password');});
formSenha.addEventListener('submit',async e=>{e.preventDefault();const atual=document.getElementById('atual').value,nova=document.getElementById('nova').value; if(nova!==document.getElementById('confirmacao').value){mostrarMensagem(msg,'As senhas não coincidem.');return;}const btn=formSenha.querySelector('button');btn.disabled=true;try{await api('/api/senha/alterar',{atual,nova});formSenha.reset();alert('Senha alterada com sucesso. Entre novamente.');location.href='login.html';}catch(e){mostrarMensagem(msg,e.message);btn.disabled=false;}});
</script></body></html>
