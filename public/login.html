<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Sistema de Correção de Provas</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

  <main class="auth-container">
    <form class="auth-card" id="form-login">
      <fieldset>
        <legend>Entre para acessar o sistema de correção de provas</legend>

        <div class="form-group">
          <label for="idLogin">Login:</label>
          <input type="text" name="login" id="idLogin" autocomplete="username" required autofocus>
        </div>

        <div class="form-group">
          <label for="idSenha">Senha:</label>
          <input type="password" name="senha" id="idSenha" autocomplete="current-password" required>
        </div>

        <div id="mensagem" class="error-message" hidden role="alert"></div>

        <div class="form-actions">
          <button type="submit" class="btn btn-salvar">Entrar</button>
        </div>

        <p class="auth-links">
          Não tem acesso? Peça seu login ao administrador da escola.<br>
          <a href="index.html">&larr; Voltar ao início</a>
        </p>
      </fieldset>
    </form>
  </main>

  <script src="script.js"></script>
  <script>
    document.getElementById('form-login').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const mensagem = document.getElementById('mensagem');
      try {
        const { role } = await api('/api/login', Object.fromEntries(new FormData(evento.target)));
        location.href = PAGINA_INICIAL[role];
      } catch (erro) {
        mostrarMensagem(mensagem, erro.message);
      }
    });
  </script>
</body>
</html>
