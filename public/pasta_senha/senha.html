<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Alterar senha | Apta</title><link rel="stylesheet" href="/compartilhado/style.css"><link rel="stylesheet" href="/pasta_senha/senha.css"></head><body class="auth-page"><main class="auth-container"><form class="auth-card" id="troca" hidden><div class="apta-brand">apta.</div><h1 class="senha-title">Alterar senha</h1><p class="senha-desc">Proteja sua conta. Após a alteração, entre novamente com a nova senha.</p>
<div class="form-group"><label for="atual">Senha atual</label><input id="atual" name="atual" type="password" autocomplete="current-password" required maxlength="1024"></div>
<div class="form-group"><label for="nova">Nova senha</label><input id="nova" name="nova" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><small>Use pelo menos 8 caracteres.</small></div>
<div class="form-group"><label for="confirmacao">Confirmar nova senha</label><input id="confirmacao" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></div>
<label class="senha-toggle"><input id="mostrar" type="checkbox"> Mostrar senhas</label><div id="mensagem" hidden role="alert"></div><button class="btn btn-salvar" type="submit">Salvar nova senha</button><p class="auth-links"><a id="voltar" href="/pasta_inicio/index.html">Voltar ao painel</a></p></form></main><script src="/compartilhado/script.js"></script><script src="/pasta_senha/senha.js"></script></body></html>
